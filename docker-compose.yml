services:
  api:
    build: .
    environment:
      - MONGO_URL=mongodb://db:27017/beerpong # Se conecta al contenedor 'db'
    depends_on:
      - db

  db:
    image: mongo:6.0 # Docker descarga e instala Mongo por ti
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Para que tus datos no se borren al apagar Docker

volumes:
  mongo_data: